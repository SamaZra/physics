<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Калькулятор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg: #1a2d3c;
            --card-bg: #1e3545;
            --text: #ffffff;
            --text-secondary: #8ba5b8;
            --accent: #1abc9c;
            --accent-strong: #16a085;
            --border: rgba(46, 204, 113, 0.1);
            --btn-bg: #2c5a77;
            --btn-number-bg: #3a6e8f;
            --display-bg: #0f2a38;
            --func-bg: #2c5a77;
            --history-bg: rgba(15, 42, 56, 0.5);

            /* общие hover */
            --btn-hover: #38698a;
            --btn-hover-border: rgba(255, 255, 255, 0.18);
            --btn-number-hover: #4a7fa0;
            --btn-func-hover: #38698a;

            /* операции */
            --op-bg: #0d6e63;
            --op-bg-active: #0a5449;
            --op-hover: #0f8578;
            --op-text: #ffffff;
            --op-border: rgba(255, 255, 255, 0.35);
            --op-hover-border: rgba(255, 255, 255, 0.5);

            /* равно */
            --eq-bg: #1abc9c;
            --eq-bg-active: #16a085;
            --eq-hover: #1fd0ad;
            --eq-text: #ffffff;
            --eq-border: rgba(255, 255, 255, 0.5);

            /* очистка */
            --clear-bg: #7a3232;
            --clear-bg-active: #642929;
            --clear-hover: #9a4040;
            --clear-border: rgba(255, 255, 255, 0.35);

            /* backspace */
            --back-bg: #7a5232;
            --back-bg-active: #644229;
            --back-hover: #9a6840;
            --back-border: rgba(255, 255, 255, 0.35);

            --btn-border: rgba(255, 255, 255, 0.08);
        }

        :root.light-mode {
            --bg: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
            --card-bg: white;
            --text: #1a2a3f;
            --text-secondary: #6a7e9c;
            --accent: #1abc9c;
            --accent-strong: #16a085;
            --border: #eff3f8;
            --btn-bg: #e2e8f0;
            --btn-number-bg: #cbd5e1;
            --display-bg: #f1f5f9;
            --func-bg: #d1d5db;
            --history-bg: #eef2f8;

            --btn-hover: #d6dee8;
            --btn-hover-border: rgba(0, 0, 0, 0.12);
            --btn-number-hover: #bcc8d4;
            --btn-func-hover: #c2c9d2;

            --op-bg: #0d9488;
            --op-bg-active: #0f766e;
            --op-hover: #0f9e91;
            --op-text: #ffffff;
            --op-border: rgba(0, 0, 0, 0.2);
            --op-hover-border: rgba(0, 0, 0, 0.3);

            --eq-bg: #1abc9c;
            --eq-bg-active: #16a085;
            --eq-hover: #1fd0ad;
            --eq-text: #ffffff;
            --eq-border: rgba(0, 0, 0, 0.25);

            --clear-bg: #dc2626;
            --clear-bg-active: #b91c1c;
            --clear-hover: #ef4444;
            --clear-border: rgba(0, 0, 0, 0.2);

            --back-bg: #ea580c;
            --back-bg-active: #c2410c;
            --back-hover: #f97316;
            --back-border: rgba(0, 0, 0, 0.2);

            --btn-border: rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .calculator {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            margin-top: 50px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .angle-toggle {
            display: flex;
            gap: 12px;
        }

        .angle-btn {
            padding: 6px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 30px;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .angle-btn:hover {
            background: var(--btn-hover);
        }

        .angle-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .history {
            background: var(--history-bg);
            border-radius: 16px;
            padding: 8px 12px;
            margin-bottom: 12px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .history-item {
            padding: 3px 0;
            border-bottom: 1px solid var(--border);
            font-family: monospace;
            cursor: pointer;
        }

        .history-item:hover {
            color: var(--accent);
            padding-left: 6px;
        }

        .clear-history {
            float: right;
            font-size: 0.65rem;
            cursor: pointer;
            background: var(--btn-bg);
            padding: 1px 6px;
            border-radius: 12px;
            margin-bottom: 4px;
        }

        .clear-history:hover {
            background: var(--accent);
            color: white;
        }

        .display {
            background: var(--display-bg);
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 16px;
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
        }

        .display .expression {
            font-size: 1rem;
            color: var(--text-secondary);
            min-height: 28px;
            font-family: monospace;
        }

        .display .result {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text);
            font-family: monospace;
            overflow-x: auto;
            white-space: nowrap;
        }

        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            padding: 12px 8px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 30px;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mode-btn:hover {
            background: var(--btn-hover);
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        button {
            padding: 18px 0;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: var(--btn-hover-border);
        }

        button:active {
            transform: scale(0.96);
            background: var(--accent);
            color: white;
        }

        .btn-number {
            background: var(--btn-number-bg);
        }
        .btn-number:hover {
            background: var(--btn-number-hover);
        }

        .btn-func {
            background: var(--func-bg);
            font-size: 0.85rem;
        }
        .btn-func:hover {
            background: var(--btn-func-hover);
        }

        /* ★ Операции */
        .btn-op {
            background: var(--op-bg);
            color: var(--op-text);
            border: 1.5px solid var(--op-border);
            font-size: 1.4rem;
            font-weight: 800;
            box-shadow: 0 3px 0 0 var(--op-bg-active);
        }
        .btn-op:hover {
            background: var(--op-hover);
            border-color: var(--op-hover-border);
            box-shadow: 0 3px 0 0 var(--op-bg-active), 0 0 12px rgba(26, 188, 156, 0.35);
        }
        .btn-op:active {
            background: var(--op-bg-active);
            color: var(--op-text);
            transform: scale(0.94) translateY(2px);
            box-shadow: 0 1px 0 0 var(--op-bg-active);
        }

        /* ★ Равно */
        .btn-equals {
            background: var(--eq-bg);
            color: var(--eq-text);
            border: 2px solid var(--eq-border);
            font-size: 1.5rem;
            font-weight: 900;
            box-shadow: 0 3px 0 0 var(--eq-bg-active);
            letter-spacing: 1px;
        }
        .btn-equals:hover {
            background: var(--eq-hover);
            box-shadow: 0 3px 0 0 var(--eq-bg-active), 0 0 16px rgba(26, 188, 156, 0.5);
        }
        .btn-equals:active {
            background: var(--eq-bg-active);
            color: var(--eq-text);
            transform: scale(0.94) translateY(2px);
            box-shadow: 0 1px 0 0 var(--eq-bg-active);
        }

        /* ★ Очистка */
        .btn-clear {
            background: var(--clear-bg);
            color: white;
            border: 1.5px solid var(--clear-border);
            font-weight: 800;
            box-shadow: 0 3px 0 0 var(--clear-bg-active);
        }
        .btn-clear:hover {
            background: var(--clear-hover);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .btn-clear:active {
            background: var(--clear-bg-active);
            color: white;
            transform: scale(0.94) translateY(2px);
            box-shadow: 0 1px 0 0 var(--clear-bg-active);
        }

        /* ★ Backspace */
        .btn-backspace {
            background: var(--back-bg);
            color: white;
            border: 1.5px solid var(--back-border);
            font-weight: 800;
            box-shadow: 0 3px 0 0 var(--back-bg-active);
        }
        .btn-backspace:hover {
            background: var(--back-hover);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .btn-backspace:active {
            background: var(--back-bg-active);
            color: white;
            transform: scale(0.94) translateY(2px);
            box-shadow: 0 1px 0 0 var(--back-bg-active);
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
            width: 100%;
        }

        .back-link:hover {
            background: var(--accent-strong);
        }

        @media (max-width: 550px) {
            body { padding: 8px; }
            .buttons { gap: 6px; }
            button { padding: 14px 0; font-size: 1rem; }
            .btn-func { font-size: 0.75rem; }
            .btn-op { font-size: 1.2rem; }
            .btn-equals { font-size: 1.25rem; }
            .display .result { font-size: 1.8rem; white-space: normal; word-break: break-all; }
            .mode-btn { font-size: 0.75rem; padding: 10px 4px; }
            .history { max-height: 60px; font-size: 0.65rem; }
        }
    </style>
<style id="back-link-center-fix">
.back-link-wrapper {
    display: flex !important;
    justify-content: center !important;
    margin: 16px 0 8px !important;
    width: 100% !important;
}
.back-link-wrapper .back-link,
.back-link-wrapper .back-btn,
.back-link-wrapper .back-button {
    display: inline-block !important;
    margin: 0 auto !important;
    text-align: center !important;
}
</style>
<style id="titles-center-fix">
/* Заголовки раскрывающихся списков — по центру, полоска слева и стрелка справа сохраняются */
.section-title {
    justify-content: center !important;
    text-align: center !important;
    position: relative !important;
    padding-left: 16px !important;
    padding-right: 28px !important;
}
.section-title::after {
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    margin-left: 0 !important;
}
.section.collapsed .section-title::after {
    transform: translateY(-50%) rotate(-90deg) !important;
}
/* Названия файлов / страниц — по центру */
h1, .page-title, .file-title, .title {
    text-align: center !important;
}
</style>
<style id="section-gradient-fix">
/* ==== ГРАДИЕНТ ОТ ЦВЕТА ЛЕВОЙ ПОЛОСКИ В БЕСЦВЕТНЫЙ + СВЕТЯЩАЯСЯ СТРЕЛКА ==== */
/* Внутренние блоки (.def-card, .formula-block, .task-block, .step) не трогаем. */

.section { position: relative; }

/* ---------- ГРАДИЕНТ У ЗАГОЛОВКА ---------- */

/* Закрыт: градиента нет */
.section.collapsed > .section-title {
    background-image: none;
    transition: background-image 0.35s ease;
}

/* Закрыт + наведение: градиент от цвета полоски к бесцветному */
.section.collapsed > .section-title:hover {
    background-image: linear-gradient(90deg,
        rgba(245, 158, 11, 0.20) 0%,
        rgba(245, 158, 11, 0.07) 45%,
        rgba(245, 158, 11, 0.00) 100%);
    background-repeat: no-repeat;
    background-size: 100% 100%;
}

/* Открыт: тот же градиент постоянно */
.section:not(.collapsed) > .section-title {
    background-image: linear-gradient(90deg,
        rgba(245, 158, 11, 0.20) 0%,
        rgba(245, 158, 11, 0.07) 45%,
        rgba(245, 158, 11, 0.00) 100%);
    background-repeat: no-repeat;
    background-size: 100% 100%;
}

/* Светлая тема — цвет из --special-border (#d97706) */
:root.light-mode .section.collapsed > .section-title:hover,
:root.light-mode .section:not(.collapsed) > .section-title {
    background-image: linear-gradient(90deg,
        rgba(217, 119, 6, 0.18) 0%,
        rgba(217, 119, 6, 0.06) 45%,
        rgba(217, 119, 6, 0.00) 100%);
}

/* ---------- СТРЕЛКА ---------- */

/* Закрыт: светящаяся синяя */
.section.collapsed > .section-title::after {
    color: var(--accent, #3b82f6) !important;
    text-shadow:
        0 0 6px rgba(59, 130, 246, 0.85),
        0 0 14px rgba(59, 130, 246, 0.55);
    filter: drop-shadow(0 0 4px rgba(59, 130, 246, 0.8));
    transition: color 0.3s ease, text-shadow 0.3s ease, filter 0.3s ease, transform 0.3s ease;
}

/* Открыт: свечение убираем, стрелка обычная */
.section:not(.collapsed) > .section-title::after {
    color: var(--text-secondary, #8ba5b8) !important;
    text-shadow: none !important;
    filter: none !important;
}

/* Плавный поворот стрелки при раскрытии (сохраняем как было) */
.section.collapsed > .section-title::after {
    transform: translateY(-50%) rotate(-90deg) !important;
}
.section:not(.collapsed) > .section-title::after {
    transform: translateY(-50%) rotate(0deg) !important;
}

/* Светлая тема: синий чуть темнее, свечение мягче */
:root.light-mode .section.collapsed > .section-title::after {
    color: var(--accent, #2563eb) !important;
    text-shadow:
        0 0 6px rgba(37, 99, 235, 0.6),
        0 0 12px rgba(37, 99, 235, 0.35);
    filter: drop-shadow(0 0 3px rgba(37, 99, 235, 0.6));
}
</style>
<style id="modern-visual-fix">
/* ==== 7. Плавный скролл + отступ у заголовков ==== */
html { scroll-behavior: smooth; }
.section-title, h1, .def-card, .task-block { scroll-margin-top: 72px; }

/* ==== 8. Радиальный градиент на фоне ==== */
body {
    background:
        radial-gradient(1200px 600px at 85% -10%, rgba(59,130,246,0.10), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(245,158,11,0.06), transparent 60%),
        var(--bg) !important;
}
:root.light-mode body {
    background:
        radial-gradient(1200px 600px at 85% -10%, rgba(37,99,235,0.08), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(217,119,6,0.05), transparent 60%),
        var(--bg) !important;
}

/* ==== 3. «Стеклянная» шапка ==== */
@media (prefers-reduced-motion: no-preference) {
    .header {
        background: rgba(30, 53, 69, 0.72) !important;
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        border-bottom: 1px solid var(--border);
    }
    :root.light-mode .header { background: rgba(255, 255, 255, 0.72) !important; }
}

/* ==== 5. Скелетоны для формул ==== */
.skeleton {
    display: inline-block;
    min-width: 60px;
    height: 1.1em;
    vertical-align: middle;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--border) 25%, var(--menu-item-hover, rgba(255,255,255,0.08)) 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmerSk 1.2s infinite linear;
}
@keyframes shimmerSk { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

/* ==== 6. Чипы категорий в поиске ==== */
.search-result-category {
    display: inline-block;
    padding: 2px 10px;
    margin-top: 4px;
    border-radius: 999px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #fff;
    background: var(--accent, #3b82f6);
}
.search-result-category.cat-mech  { background: #3b82f6; }
.search-result-category.cat-thermo{ background: #f59e0b; }
.search-result-category.cat-elec  { background: #eab308; }
.search-result-category.cat-other { background: #64748b; }

/* ==== 4. Нижняя навигация ==== */
.bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 22px;
    background: rgba(30, 53, 69, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    box-shadow: 0 12px 28px -10px rgba(0,0,0,0.45);
    z-index: 900;
    transition: background 0.3s, border 0.3s;
}
:root.light-mode .bottom-nav { background: rgba(255,255,255,0.9); }
.bottom-nav a, .bottom-nav button {
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 46px; border-radius: 14px;
    border: none; background: transparent;
    color: var(--text-secondary); font-size: 22px;
    cursor: pointer; text-decoration: none;
    transition: all 0.2s;
}
.bottom-nav a:hover, .bottom-nav button:hover, .bottom-nav a.active {
    background: rgba(59,130,246,0.15);
    color: var(--accent);
    transform: translateY(-2px);
}
body { padding-bottom: 78px; }

/* ==== 10. Круг смены темы ==== */
.theme-circle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    background: var(--bg);
    transform: scale(0);
    opacity: 0.95;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s;
}
.theme-circle.expand { transform: scale(1); opacity: 0; }

/* ==== 2. Ripple при тапе ==== */
.ripple-host { position: relative !important; overflow: hidden !important; }
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(59,130,246,0.35);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 0;
}
@keyframes rippleAnim { to { transform: scale(2.5); opacity: 0; } }
:root.light-mode .ripple { background: rgba(37,99,235,0.28); }
</style>
<style id="search-clean-fix">
/* ==== Убираем эмодзи-иконки в результатах поиска ==== */
.search-result-icon {
    display: none !important;
}

/* ==== Скрываем видимую полосу прокрутки у результатов поиска ==== */
.search-results {
    scrollbar-width: none;          /* Firefox */
    -ms-overflow-style: none;       /* IE/Edge */
}
.search-results::-webkit-scrollbar {
    width: 0 !important;
    height: 0 !important;
    display: none !important;
}

/* На всякий случай — скрыть скроллбар и у body (если где-то наследуется) */
body::-webkit-scrollbar {
    width: 0 !important;
    height: 0 !important;
}
body {
    scrollbar-width: none;
    -ms-overflow-style: none;
}
</style>
<style id="nav-back-hide-index">
/* На главной кнопка «Назад» не нужна */
body.is-index .nav-back-btn { display: none !important; }
</style>
<style id="bottom-nav-autohide">
/* Автоскрытие нижней панели при скролле вниз */
.bottom-nav {
    transition: transform 0.3s ease, opacity 0.3s ease, background 0.3s, border 0.3s;
}
.bottom-nav.nav-hidden {
    transform: translate(-50%, 120%);
    opacity: 0;
    pointer-events: none;
}
/* На главной панель всегда видна */
body.is-index .bottom-nav.nav-hidden {
    transform: translate(-50%, 0);
    opacity: 1;
    pointer-events: auto;
}
</style>
<style id="fav-nav-yellow">
/* Избранное в нижней панели — жёлтое выделение, когда активно */
.bottom-nav a[href="favorites.html"].active,
.bottom-nav a[href="favorites.html"].fav-active {
    background: rgba(250, 204, 21, 0.18) !important;
    color: #facc15 !important;
}
.bottom-nav a[href="favorites.html"].active:hover,
.bottom-nav a[href="favorites.html"].fav-active:hover {
    background: rgba(250, 204, 21, 0.28) !important;
    color: #fde047 !important;
}
:root.light-mode .bottom-nav a[href="favorites.html"].active,
:root.light-mode .bottom-nav a[href="favorites.html"].fav-active {
    background: rgba(234, 179, 8, 0.18) !important;

<body>
<div class="container">
    <div class="calculator">
        <div class="top-bar">
            <div class="angle-toggle">
                <button class="angle-btn active" onclick="setAngleMode('deg')">Deg</button>
                <button class="angle-btn" onclick="setAngleMode('rad')">Rad</button>
            </div>
            <div style="width: 40px;"></div>
        </div>

        <div class="history" id="historyContainer">
            <div class="clear-history" onclick="clearHistory()">✖ Очистить</div>
            <div id="historyList">—</div>
        </div>

        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('basic')">Обычный</button>
            <button class="mode-btn" onclick="setMode('engineer')">Инженерный</button>
            <button class="mode-btn" onclick="setMode('programmer')">Программист</button>
        </div>

        <div class="buttons" id="buttons"></div>
    </div>

    <div style="text-align: center; margin-top: 16px;">
        <div class="back-link-wrapper"><a href="index.html" class="back-link">← Назад в меню</a></div>
    </div>
</div>

<script>
    let currentMode = 'basic';
    let angleUnit = 'deg';
    let expression = '';
    let result = '0';
    let history = [];

    function loadHistory() {
        const saved = localStorage.getItem('calculator_history');
        if (saved) {
            try { history = JSON.parse(saved); } catch(e) { history = []; }
        }
        updateHistoryDisplay();
    }

    function saveHistory() {
        localStorage.setItem('calculator_history', JSON.stringify(history.slice(-20)));
    }

    function addToHistory(expr, res) {
        if (expr && res && res !== '?' && res !== 'Ошибка') {
            history.unshift({ expr: expr, result: res });
            if (history.length > 20) history.pop();
            saveHistory();
            updateHistoryDisplay();
        }
    }

    function updateHistoryDisplay() {
        const historyList = document.getElementById('historyList');
        if (!historyList) return;
        if (history.length === 0) {
            historyList.innerHTML = '—';
            return;
        }
        let html = '';
        for (let i = 0; i < Math.min(history.length, 8); i++) {
            html += `<div class="history-item" onclick="restoreFromHistory(${i})">${history[i].expr} = ${history[i].result}</div>`;
        }
        historyList.innerHTML = html;
    }

    function restoreFromHistory(index) {
        if (history[index]) {
            expression = history[index].expr;
            result = history[index].result;
            updateDisplay();
        }
    }

    function clearHistory() {
        history = [];
        saveHistory();
        updateHistoryDisplay();
    }

    const basicButtons = [
        '7', '8', '9', '/', 'C',
        '4', '5', '6', '*', '⌫',
        '1', '2', '3', '-', '=',
        '0', '.', '+/-', '+', '%'
    ];

    const engineerButtons = [
        'sin', 'cos', 'tg', '^', 'C',
        'ln', 'log', '√', '(', ')',
        '7', '8', '9', '/', '⌫',
        '4', '5', '6', '*', '-',
        '1', '2', '3', '+', '=',
        '0', '.', 'e', 'x²', 'π',
        '1/x', '|x|', '!', 'mod', 'rad'
    ];

    const programmerButtons = [
        'HEX', 'DEC', 'BIN', 'AND', 'C',
        'A', 'B', 'C', 'OR', '⌫',
        'D', 'E', 'F', 'XOR', 'NOT',
        '7', '8', '9', '<<', '>>',
        '4', '5', '6', '(', ')',
        '1', '2', '3', '=', '0',
        '.', '+', '-', '*', '/'
    ];

    function isDigit(btn) {
        return (btn >= '0' && btn <= '9') || btn === '.';
    }

    function isOperator(btn) {
        return btn === '+' || btn === '-' || btn === '*' || btn === '/' || btn === '^' || btn === 'mod';
    }

    function percent() {
        try {
            let currentVal = evaluateExpressionRaw(expression);
            if (currentVal !== null && !isNaN(currentVal)) {
                let percentVal = currentVal / 100;
                expression = percentVal.toString();
                result = percentVal.toString();
                updateDisplay();
            }
        } catch(e) {
            result = 'Ошибка';
            updateDisplay();
        }
    }

    function prepareForEval(expr) {
        let evalExpr = expr
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/\bmod\b/g, ' % ')
            .replace(/\^/g, '**')
            .replace(/sin\(/g, 'Math.sin(')
            .replace(/cos\(/g, 'Math.cos(')
            .replace(/tg\(/g, 'Math.tan(')
            .replace(/ln\(/g, 'Math.log(')
            .replace(/log\(/g, 'Math.log10(')
            .replace(/sqrt\(/g, 'Math.sqrt(')
            .replace(/abs\(/g, 'Math.abs(')
            .replace(/PI/g, Math.PI)
            .replace(/E/g, Math.E);

        if (angleUnit === 'deg') {
            evalExpr = evalExpr.replace(/Math\.sin\(([^)]+)\)/g, 'Math.sin($1 * Math.PI / 180)');
            evalExpr = evalExpr.replace(/Math\.cos\(([^)]+)\)/g, 'Math.cos($1 * Math.PI / 180)');
            evalExpr = evalExpr.replace(/Math\.tan\(([^)]+)\)/g, 'Math.tan($1 * Math.PI / 180)');
        }

        return evalExpr;
    }

    function evaluateExpressionRaw(expr) {
        try {
            return eval(prepareForEval(expr));
        } catch(e) {
            return null;
        }
    }

    function renderButtons() {
        const container = document.getElementById('buttons');
        let buttons = currentMode === 'basic' ? basicButtons : (currentMode === 'engineer' ? engineerButtons : programmerButtons);

        container.innerHTML = '';
        buttons.forEach(btn => {
            const button = document.createElement('button');
            button.textContent = btn;

            if (isDigit(btn)) {
                button.classList.add('btn-number');
            }

            if (btn === 'C') {
                button.onclick = () => handleClear('C');
                button.classList.add('btn-clear');
            } else if (btn === '⌫') {
                button.onclick = () => handleClear('⌫');
                button.classList.add('btn-backspace');
            } else if (btn === '=') {
                button.onclick = calculate;
                button.classList.add('btn-equals');
            } else if (btn === '(') {
                button.onclick = () => addOperator('(');
                button.classList.add('btn-func');
            } else if (btn === ')') {
                button.onclick = () => addOperator(')');
                button.classList.add('btn-func');
            } else if (btn === 'sin' || btn === 'cos') {
                button.onclick = () => addFunction(btn);
                button.classList.add('btn-func');
            } else if (btn === 'tg') {
                button.onclick = () => addFunction('tan');
                button.classList.add('btn-func');
            } else if (btn === 'ln' || btn === 'log') {
                button.onclick = () => addFunction(btn);
                button.classList.add('btn-func');
            } else if (btn === '√') {
                button.onclick = () => addFunction('sqrt');
                button.classList.add('btn-func');
            } else if (btn === 'x²') {
                button.onclick = () => addPower('2');
                button.classList.add('btn-func');
            } else if (btn === 'x³') {
                button.onclick = () => addPower('3');
                button.classList.add('btn-func');
            } else if (btn === '1/x') {
                button.onclick = () => addFunction('1/');
                button.classList.add('btn-func');
            } else if (btn === '|x|') {
                button.onclick = () => addFunction('abs');
                button.classList.add('btn-func');
            } else if (btn === '!') {
                button.onclick = factorial;
                button.classList.add('btn-func');
            } else if (btn === 'π') {
                button.onclick = () => addConstant('PI');
                button.classList.add('btn-func');
            } else if (btn === 'e') {
                button.onclick = () => addConstant('E');
                button.classList.add('btn-func');
            } else if (btn === 'rad') {
                button.onclick = degToRad;
                button.classList.add('btn-func');
            } else if (btn === '+/-') {
                button.onclick = toggleSign;
                button.classList.add('btn-func');
            } else if (btn === 'AND' || btn === 'OR' || btn === 'XOR') {
                button.onclick = () => addOperator(btn.toLowerCase());
                button.classList.add('btn-func');
            } else if (btn === 'NOT') {
                button.onclick = bitwiseNot;
                button.classList.add('btn-func');
            } else if (btn === '<<' || btn === '>>') {
                button.onclick = () => addOperator(btn);
                button.classList.add('btn-func');
            } else if (btn === 'HEX' || btn === 'DEC' || btn === 'BIN') {
                button.onclick = () => changeBase(btn);
                button.classList.add('btn-func');
            } else if (btn === 'A' || btn === 'B' || btn === 'C' || btn === 'D' || btn === 'E' || btn === 'F') {
                button.onclick = () => addNumber(btn);
                button.classList.add('btn-func');
            } else if (btn === '%') {
                button.onclick = percent;
                button.classList.add('btn-op');
            } else if (isOperator(btn)) {
                button.onclick = () => addOperator(btn);
                button.classList.add('btn-op');
            } else {
                button.onclick = () => addNumber(btn);
            }

            container.appendChild(button);
        });
    }

    function addPower(power) {
        expression += '^' + power;
        updateDisplay();
    }

    function addConstant(constant) {
        if (constant === 'PI') expression += Math.PI;
        if (constant === 'E') expression += Math.E;
        updateDisplay();
    }

    function degToRad() {
        try {
            let val = evaluateExpressionRaw(expression);
            if (val !== null) {
                expression = (val * Math.PI / 180).toString();
                evaluateExpression();
                updateDisplay();
            }
        } catch (e) {}
    }

    function factorial() {
        try {
            let n = evaluateExpressionRaw(expression);
            if (n !== null && n >= 0 && Number.isInteger(n)) {
                let fact = 1;
                for (let i = 2; i <= n; i++) fact *= i;
                expression = fact.toString();
                result = fact.toString();
                updateDisplay();
            } else {
                result = 'Ошибка';
                updateDisplay();
            }
        } catch (e) {
            result = 'Ошибка';
            updateDisplay();
        }
    }

    function bitwiseNot() {
        try {
            let val = evaluateExpressionRaw(expression);
            if (val !== null) {
                expression = (~val).toString();
                result = expression;
                updateDisplay();
            }
        } catch (e) {}
    }

    function changeBase(base) {
        try {
            let val = parseInt(evaluateExpressionRaw(expression));
            if (base === 'HEX') expression = '0x' + val.toString(16).toUpperCase();
            if (base === 'BIN') expression = '0b' + val.toString(2);
            if (base === 'DEC') expression = val.toString();
            result = expression;
            updateDisplay();
        } catch (e) {}
    }

    function handleClear(btn) {
        if (btn === 'C') {
            expression = '';
            result = '0';
        } else if (btn === '⌫') {
            expression = expression.slice(0, -1);
            if (expression === '') result = '0';
            else evaluateExpression();
        }
        updateDisplay();
    }

    function addNumber(num) {
        expression += num;
        evaluateExpression();
        updateDisplay();
    }

    function addOperator(op) {
        const lastChar = expression.slice(-1);
        if (lastChar && '+-*/%^'.includes(lastChar)) {
            expression = expression.slice(0, -1) + op;
        } else {
            if (op === 'mod') {
                expression += ' mod ';
            } else {
                expression += op;
            }
        }
        updateDisplay();
    }

    function addFunction(func) {
        expression += func + '(';
        updateDisplay();
    }

    function toggleSign() {
        if (expression) {
            if (expression[0] === '-') expression = expression.slice(1);
            else expression = '-' + expression;
            evaluateExpression();
            updateDisplay();
        }
    }

    function evaluateExpression() {
        try {
            let calcResult = eval(prepareForEval(expression));
            result = calcResult.toString();
        } catch (e) {
            if (expression && !isNaN(expression)) result = expression;
            else result = '?';
        }
    }

    function calculate() {
        if (!expression) return;
        const currentExpr = expression;
        evaluateExpression();
        if (result !== '?' && result !== 'Ошибка') {
            addToHistory(currentExpr, result);
            expression = result;
        }
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('expression').textContent = expression || '';
        document.getElementById('result').textContent = result;
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        expression = '';
        result = '0';
        renderButtons();
        updateDisplay();
    }

    function setAngleMode(mode) {
        angleUnit = mode;
        document.querySelectorAll('.angle-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        if (expression) {
            evaluateExpression();
            updateDisplay();
        }
    }

    (function() {
        var savedTheme = localStorage.getItem('mathTheme');
        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-mode');
            var btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = '☀️';
        }
        loadHistory();
    })();

    renderButtons();
    updateDisplay();

    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') addNumber(e.key);
        if (e.key === '.') addNumber('.');
        if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') addOperator(e.key);
        if (e.key === 'Enter') calculate();
        if (e.key === 'Escape') handleClear('C');
        if (e.key === 'Backspace') handleClear('⌫');
        if (e.key === '(') addOperator('(');
        if (e.key === ')') addOperator(')');
    });
</script>

<script>
/* ==== 5. Скелетоны для формул MathJax ==== */
(function(){
    function addSkeletons(){
        document.querySelectorAll('.formula-block').forEach(function(el){
            if (el.querySelector('mjx-container')) return;
            if (el.dataset.sk) return;
            el.dataset.sk = '1';
            var s = document.createElement('span');
            s.className = 'skeleton';
            s.style.width = (60 + Math.random()*80) + 'px';
            el.appendChild(s);
        });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addSkeletons);
    else addSkeletons();
    setTimeout(function(){ document.querySelectorAll('.skeleton').forEach(function(s){ s.remove(); }); }, 2500);
})();

/* ==== 6. Чипы категорий в результатах поиска ==== */
(function(){
    function classify(cat){
        var c = (cat||'').toLowerCase();
        if (c.indexOf('механик') >= 0) return 'cat-mech';
        if (c.indexOf('молекуляр') >= 0 || c.indexOf('термодинам') >= 0 || c.indexOf('мкт') >= 0) return 'cat-thermo';
        if (c.indexOf('электр') >= 0) return 'cat-elec';
        return 'cat-other';
    }
    function decorate(){
        document.querySelectorAll('.search-result-category').forEach(function(el){
            if (el.dataset.chip) return;
            el.dataset.chip = '1';
            el.classList.add(classify(el.textContent));
        });
    }
    var orig = window.performSearch;
    if (typeof orig === 'function') {
        window.performSearch = function(){
            orig.apply(this, arguments);
            decorate();
        };
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', decorate);
    else decorate();
})();

/* ==== 10. Анимация смены темы «как на iPhone» ==== */
(function(){
    function animateThemeChange(x, y){
        var circle = document.createElement('div');
        circle.className = 'theme-circle';
        var maxR = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) * 1.2;
        circle.style.width = circle.style.height = (maxR*2) + 'px';
        circle.style.left = (x - maxR) + 'px';
        circle.style.top  = (y - maxR) + 'px';
        document.body.appendChild(circle);
        requestAnimationFrame(function(){ circle.classList.add('expand'); });
        setTimeout(function(){ circle.remove(); }, 700);
    }
    document.addEventListener('click', function(e){
        var t = e.target.closest('#themeBtn, .theme-toggle, .bottom-nav button[title="Сменить тему"]');
        if (!t) return;
        var r = t.getBoundingClientRect();
        animateThemeChange(r.left + r.width/2, r.top + r.height/2);
    }, true);
})();

/* ==== 2. Ripple при тапе ==== */
(function(){
    var sel = '.menu-item, .submenu-item, .search-result-item, .section-title, .model-tab, .show-solution-btn, .back-link, .bottom-nav a, .bottom-nav button';
    function bind(el){
        if (el.dataset.rippleBound) return;
        el.dataset.rippleBound = '1';
        if (!el.classList.contains('ripple-host')) el.classList.add('ripple-host');
        el.addEventListener('pointerdown', function(e){
            var rect = el.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            var r = document.createElement('span');
            r.className = 'ripple';
            r.style.width = r.style.height = size + 'px';
            r.style.left = (e.clientX - rect.left - size/2) + 'px';
            r.style.top  = (e.clientY - rect.top  - size/2) + 'px';
            el.appendChild(r);
            setTimeout(function(){ r.remove(); }, 650);
        });
    }
    function bindAll(){
        document.querySelectorAll(sel).forEach(bind);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindAll);
    else bindAll();
    /* Перепривязка после поиска */
    var orig = window.performSearch;
    if (typeof orig === 'function') {
        window.performSearch = function(){
            orig.apply(this, arguments);
            setTimeout(bindAll, 30);
        };
    }
})();
</script>

<script>
/* Автоскрытие нижней панели при скролле */
(function(){
    var nav = document.querySelector('.bottom-nav');
    if (!nav) return;
    var lastY = window.scrollY;
    var threshold = 8;
    var ticking = false;
    function onScroll(){
        var y = window.scrollY;
        if (Math.abs(y - lastY) < threshold) { ticking = false; return; }
        if (y > lastY && y > 80) {
            nav.classList.add('nav-hidden');
        } else {
            nav.classList.remove('nav-hidden');
        }
        lastY = y;
        ticking = false;
    }
    window.addEventListener('scroll', function(){
        if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
    }, { passive: true });
})();
</script>

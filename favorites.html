<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Избранное — Физика в кармане</title>
    <meta name="theme-color" content="#3b82f6">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a2d3c;
            --card-bg: #1e3545;
            --text: #ffffff;
            --text-secondary: #8ba5b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --border: rgba(59, 130, 246, 0.15);
            --header-bg: linear-gradient(135deg, #1e3545, #162a38);
            --menu-card-bg: #1e3545;
            --menu-item-bg: #1e3545;
            --menu-item-hover: #233e50;
            --card-shadow: rgba(0,0,0,0.2);
        }
        :root.light-mode {
            --bg: #f0f4fa;
            --card-bg: #ffffff;
            --text: #1a2a3f;
            --text-secondary: #5a7a94;
            --accent: #2563eb;
            --accent-hover: #3b82f6;
            --border: #d0d8e0;
            --header-bg: linear-gradient(135deg, #ffffff, #f8fafc);
            --menu-card-bg: white;
            --menu-item-bg: white;
            --menu-item-hover: #f0f4fa;
            --card-shadow: rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(1200px 600px at 85% -10%, rgba(59,130,246,0.10), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(245,158,11,0.06), transparent 60%),
                var(--bg);
            min-height: 100vh;
            color: var(--text);
            padding: 32px 20px 96px;
            transition: background 0.3s;
        }
        :root.light-mode body {
            background:
                radial-gradient(1200px 600px at 85% -10%, rgba(37,99,235,0.08), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(217,119,6,0.05), transparent 60%),
                var(--bg);
        }

        .container { max-width: 720px; margin: 0 auto; position: relative; }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 32px 24px 26px;
            background: var(--header-bg);
            border-radius: 40px;
            box-shadow: 0 8px 24px var(--card-shadow);
            border: 1px solid var(--border);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .subtitle { color: var(--text-secondary); font-size: 0.85rem; }

        .content-card {
            background: var(--menu-card-bg);
            border-radius: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px -12px var(--card-shadow);
            padding: 20px;
            transition: background 0.3s, border 0.3s;
        }

        /* Строка поиска по избранному */
        .fav-search {
            display: flex; align-items: center; gap: 10px;
            background: var(--menu-item-hover);
            border: 1.5px solid var(--border);
            border-radius: 999px;
            padding: 8px 16px;
            margin-bottom: 16px;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.3s;
        }
        .fav-search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        .fav-search .icon {
            color: var(--text-secondary); font-size: 18px;
        }
        .fav-search input {
            flex: 1; background: transparent; border: none; outline: none;
            font-size: 0.95rem; color: var(--text); padding: 6px 0;
        }
        .fav-search input::placeholder { color: var(--text-secondary); font-size: 0.9rem; }
        .fav-search .clear {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-secondary); font-size: 16px;
            padding: 4px 6px; border-radius: 50%;
            display: none;
        }
        .fav-search .clear.show { display: inline-flex; }
        .fav-search .clear:hover { color: var(--accent); background: rgba(59,130,246,0.12); }

        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .favorites-count {
            background: var(--accent);
            padding: 6px 14px;
            border-radius: 999px;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .clear-all-btn {
            background: var(--menu-item-bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 999px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .clear-all-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .favorites-list { display: flex; flex-direction: column; gap: 14px; }

        /* Группа по категории */
        .fav-group { display: flex; flex-direction: column; gap: 8px; }
        .fav-group-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.78rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--text-secondary);
            padding: 4px 4px 2px;
        }
        .fav-group-title .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }
        .fav-group-title.cat-mech .dot   { background: #3b82f6; }
        .fav-group-title.cat-thermo .dot { background: #f59e0b; }
        .fav-group-title.cat-elec .dot   { background: #eab308; }
        .fav-group-title.cat-other .dot  { background: #64748b; }

        .fav-group-title .badge {
            margin-left: auto;
            background: var(--menu-item-hover);
            color: var(--text-secondary);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        .favorite-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: var(--menu-item-bg);
            border-radius: 18px;
            border: 1.5px solid transparent;
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .favorite-item:hover {
            border-color: var(--accent);
            box-shadow: 0 6px 18px -8px rgba(59,130,246,0.35);
            transform: translateX(4px);
        }
        .favorite-content { flex: 1; min-width: 0; }
        .favorite-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .favorite-desc {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.35;
        }
        .remove-fav {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 8px 10px;
            border-radius: 12px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .remove-fav:hover { color: #ef4444; background: rgba(239,68,68,0.12); transform: scale(1.08); }

        .empty-state { text-align: center; padding: 56px 20px; color: var(--text-secondary); }
        .empty-state .empty-icon { font-size: 56px; margin-bottom: 14px; display: block; opacity: 0.8; }
        .empty-state p { margin-bottom: 10px; font-size: 0.9rem; line-height: 1.5; }
        .empty-state .hint { font-size: 0.78rem; opacity: 0.75; }

        .back-link-wrapper { display: flex; justify-content: center; margin: 24px 0 8px; width: 100%; }
        .back-link {
            display: inline-block;
            padding: 10px 24px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            transition: background 0.2s, transform 0.2s;
        }
        .back-link:hover { background: var(--accent-hover); transform: translateY(-1px); }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 22px;
            background: rgba(30, 53, 69, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            box-shadow: 0 12px 28px -10px rgba(0,0,0,0.45);
            z-index: 900;
            transition: background 0.3s, border 0.3s, transform 0.3s ease, opacity 0.3s ease;
        }
        :root.light-mode .bottom-nav { background: rgba(255,255,255,0.9); }
        .bottom-nav.nav-hidden { transform: translate(-50%, 120%); opacity: 0; pointer-events: none; }
        .bottom-nav a, .bottom-nav button {
            display: flex; align-items: center; justify-content: center;
            width: 46px; height: 46px; border-radius: 14px;
            border: none; background: transparent;
            color: var(--text-secondary); font-size: 22px;
            cursor: pointer; text-decoration: none;
            transition: all 0.2s;
        }
        .bottom-nav a:hover, .bottom-nav button:hover, .bottom-nav a.active {
            background: rgba(59,130,246,0.15);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .bottom-nav a[href="favorites.html"].active {
            background: rgba(250, 204, 21, 0.20) !important;
            color: #facc15 !important;
        }

        /* Ripple */
        .ripple-host { position: relative !important; overflow: hidden !important; }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(59,130,246,0.35);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rippleAnim { to { transform: scale(2.5); opacity: 0; } }

        @media (max-width: 550px) {
            body { padding: 20px 14px 96px; }
            h1 { font-size: 1.3rem; }
            .header { padding: 26px 20px 22px; }
            .favorite-item { padding: 12px 14px; }
        }
    </style>
<style id="share-btn-right">
/* Прижимаем кнопку «Поделиться» к правому краю панели */
.bottom-nav button[title="Поделиться"] {
    order: 99 !important;
    margin-left: auto !important;
}
</style>
<style id="no-tap-highlight">
/* Убираем системный голубой/серый прямоугольник при тапе */
* {
    -webkit-tap-highlight-color: transparent !important;
    -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
}
a, button, div, span, label, input, textarea, select {
    -webkit-tap-highlight-color: transparent !important;
    -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
    outline: none !important;
}
</style>
<style id="no-tap-highlight-accordion">
/* Убираем системный голубой/серый прямоугольник при тапе на заголовки списков */
.section-title,
.group-header,
.menu-item,
.submenu-item,
.model-tab,
.search-result-item {
    -webkit-tap-highlight-color: transparent !important;
    -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
    outline: none !important;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
}

/* Лёгкий отклик при нажатии (вместо системного квадратика) */
.section-title:active,
.group-header:active {
    transform: scale(0.99);
    transition: transform 0.1s;
}
</style>
<style id="fix-nav-bounce">
    /* Отключаем сдвиги и пружины у кнопок нижней панели */
    .bottom-nav a, .bottom-nav button {
        transform: none !important;
        transition: background 0.2s ease, color 0.2s ease !important;
    }
    .bottom-nav a:active, .bottom-nav button:active, 
    .bottom-nav a:focus, .bottom-nav button:focus {
        transform: none !important;
        outline: none !important;
        box-shadow: none !important;
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⭐ Избранное</h1>
        <div class="subtitle">Ваши сохранённые страницы справочника</div>
    </div>

    <div class="content-card">
        <div class="fav-search">
            <span class="icon">⌕</span>
            <input type="text" id="favSearchInput" placeholder="Поиск по избранному..." autocomplete="off">
            <button class="clear" id="favSearchClear" type="button" title="Очистить">✖</button>
        </div>

        <div class="favorites-header">
            <span class="favorites-count" id="favCount">0</span>
            <button class="clear-all-btn" onclick="window.clearAllFavorites()">Очистить всё</button>
        </div>
        <div class="favorites-list" id="favoritesList">
            <div class="empty-state">Загрузка...</div>
        </div>
    </div>

    <div class="back-link-wrapper">
        <a href="index.html" class="back-link">← Назад в меню</a>
    </div>
</div>

<nav class="bottom-nav" aria-label="Быстрая навигация">
    <a href="index.html" title="Главная" aria-label="Главная">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5"/>
            <path d="M5 9.5V21h14V9.5"/>
            <path d="M9.5 21v-6h5v6"/>
        </svg>
    </a>
    <button type="button" title="Поиск" aria-label="Поиск" onclick="if(window.openSearchOverlay) window.openSearchOverlay(); else location.href='index.html#search';">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
        </svg>
    </button>
    <a href="favorites.html" title="Избранное" aria-label="Избранное">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9L3.5 9.7l5.9-.9L12 3.5z"/>
        </svg>
    </a>
    <button type="button" title="Настройки" aria-label="Настройки" onclick="if(window.Android && window.Android.openQualityDialog) { window.Android.openQualityDialog(); } else { alert('Настройки 3D доступны только в приложении'); }">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
    </button>
    </nav>

<script src="physics-data.js"></script>
<script src="favorites.js"></script>
<script src="theme.js"></script>
<script src="search-overlay.js"></script>
<script>
/* Автоскрытие нижней панели */
(function(){
    var nav = document.querySelector('.bottom-nav');
    if (!nav) return;
    var lastY = window.scrollY, threshold = 8, ticking = false;
    function onScroll(){
        var y = window.scrollY;
        if (Math.abs(y - lastY) < threshold) { ticking = false; return; }
        if (y > lastY && y > 80) nav.classList.add('nav-hidden');
        else nav.classList.remove('nav-hidden');
        lastY = y; ticking = false;
    }
    window.addEventListener('scroll', function(){
        if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
    }, { passive: true });
})();
/* Ripple */
(function(){
    var sel = '.favorite-item, .back-link, .bottom-nav a, .bottom-nav button';
    document.querySelectorAll(sel).forEach(function(el){
        if (el.dataset.rippleBound) return;
        el.dataset.rippleBound = '1';
        el.classList.add('ripple-host');
        el.addEventListener('pointerdown', function(e){
            var rect = el.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            var r = document.createElement('span');
            r.className = 'ripple';
            r.style.width = r.style.height = size + 'px';
            r.style.left = (e.clientX - rect.left - size/2) + 'px';
            r.style.top  = (e.clientY - rect.top  - size/2) + 'px';
            el.appendChild(r);
            setTimeout(function(){ r.remove(); }, 650);
        });
    });
})();
</script>
</body>

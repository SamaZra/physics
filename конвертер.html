<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Физический конвертер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #1a2d3c; --card-bg: #1e3545; --text: #ffffff; --text-secondary: #8ba5b8;
            --accent: #1abc9c; --accent-strong: #16a085; --border: rgba(46, 204, 113, 0.1);
            --btn-bg: #2c5a77; --display-bg: #0f2a38; --func-bg: #2c5a77; --example-bg: #162a38;
            --menu-item-hover: #233e50; --icon-color: #8ba5b8; --history-bg: rgba(15, 42, 56, 0.5);
        }
        :root.light-mode {
            --bg: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
            --card-bg: white; --text: #1a2a3f; --text-secondary: #5a7a94; --accent: #1abc9c;
            --accent-strong: #16a085; --border: #e2e8f0; --btn-bg: #e2e8f0; --display-bg: #f1f5f9;
            --func-bg: #eef2ff; --example-bg: #e8f0fe; --menu-item-hover: #f8fafd; --icon-color: #1a2d3c;
            --history-bg: #eef2f8;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            transition: background 0.3s; overflow: hidden; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        }
        .container { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 16px; position: relative; }
        .converter-card {
            background: var(--card-bg); border-radius: 32px; padding: 16px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2); border: 1px solid var(--border);
            flex: 1; display: flex; flex-direction: column; min-height: 0;
        }
        .history {
            background: var(--history-bg); border-radius: 16px; padding: 8px 12px;
            margin-bottom: 12px; margin-top: 50px; max-height: 80px; overflow-y: auto;
            font-size: 0.7rem; color: var(--text-secondary);
        }
        .history-item { padding: 3px 0; border-bottom: 1px solid var(--border); font-family: monospace; cursor: pointer; }
        .history-item:hover { color: var(--accent); padding-left: 6px; }
        .clear-history { float: right; font-size: 0.65rem; cursor: pointer; background: var(--btn-bg); padding: 1px 6px; border-radius: 12px; margin-bottom: 4px; }
        .clear-history:hover { background: var(--accent); color: white; }
        .categories-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; flex: 1;
            align-content: start; margin-bottom: 16px; overflow-y: auto; padding: 4px;
        }
        .cat-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px 12px; border-radius: 24px; text-decoration: none; transition: all 0.2s ease;
            cursor: pointer; background: var(--btn-bg); color: var(--text); border: none;
            font-family: inherit; gap: 12px; text-align: center; min-height: 100px;
        }
        .cat-card:hover { background: var(--menu-item-hover); transform: translateY(-2px); }
        .cat-card:active { transform: scale(0.97); }
        .cat-icon { font-size: 28px; font-weight: 500; color: var(--icon-color); transition: all 0.2s ease; font-family: 'Segoe UI', 'Inter', monospace; line-height: 1; }
        .cat-card:hover .cat-icon { color: var(--accent); transform: scale(1.05); }
        .cat-title { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; line-height: 1.3; }

        .back-link-wrapper { text-align: center; margin-top: auto; padding-top: 12px; flex-shrink: 0; }
        .back-link {
            display: inline-block; width: auto; min-width: 180px; padding: 14px 28px;
            background: var(--accent); color: white; text-decoration: none; border-radius: 44px;
            font-weight: 700; font-size: 1rem; text-align: center; cursor: pointer; border: none; transition: 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .back-link:hover { background: var(--accent-strong); }
        .back-link:active { transform: scale(0.97); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px);
            align-items: center; justify-content: center; z-index: 1001; padding: 16px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 460px; border-radius: 44px;
            overflow-y: auto; max-height: 85vh; box-shadow: 0 30px 45px rgba(0, 0, 0, 0.3); border: 1px solid var(--border);
        }
        .modal-header { padding: 18px 20px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
        .modal-header h3 { font-size: 22px; font-weight: 700; color: var(--text); }
        .close-modal { font-size: 32px; cursor: pointer; color: var(--text-secondary); padding: 0 8px; line-height: 1; }
        .close-modal:hover { color: var(--accent); }
        .converter-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
        .input-group, .output-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label, .output-group label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
        .converter-input, .converter-output {
            background: var(--display-bg); border: 1px solid var(--border); border-radius: 28px;
            padding: 14px 18px; font-size: 17px; font-weight: 500; color: var(--text); outline: none; width: 100%; font-family: monospace;
        }
        .converter-input:focus { border-color: var(--accent); }
        .converter-output { background: var(--func-bg); cursor: default; word-break: break-word; }
        .unit-select-row { display: flex; gap: 12px; align-items: center; width: 100%; flex-wrap: nowrap; }
        .select-unit {
            flex: 1; background: var(--btn-bg); border-radius: 40px; padding: 12px 8px;
            border: 1px solid var(--border); font-size: 13px; font-weight: 500; color: var(--text);
            cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
        }
        .swap-icon {
            background: var(--card-bg); border-radius: 48px; padding: 6px 12px; font-size: 20px;
            cursor: pointer; color: var(--accent); border: 1px solid var(--border); flex-shrink: 0; user-select: none;
        }
        .swap-icon:hover { background: var(--accent); color: white; }
        .info-note {
            font-size: 11px; color: var(--text-secondary); text-align: center;
            background: var(--example-bg); padding: 8px 12px; border-radius: 20px;
        }
        @media (max-width: 520px) {
            .categories-grid { gap: 10px; }
            .cat-card { padding: 16px 8px; min-height: 85px; }
            .cat-icon { font-size: 24px; }
            .cat-title { font-size: 12px; }
        }
        @media (max-width: 420px) {
            .categories-grid { gap: 8px; }
            .cat-card { padding: 14px 6px; min-height: 75px; }
            .cat-icon { font-size: 22px; }
            .cat-title { font-size: 11px; }
        }
        @media (max-width: 480px) {
            .select-unit { font-size: 11px; padding: 10px 6px; }
            .converter-body { padding: 16px; }
            .unit-select-row { gap: 8px; }
            .swap-icon { padding: 4px 8px; font-size: 18px; }
        }
    </style>
    <style id="no-tap-highlight">
        * { -webkit-tap-highlight-color: transparent !important; }
    </style>
<style id="fix-nav-bounce">
    /* Отключаем сдвиги и пружины у кнопок нижней панели */
    .bottom-nav a, .bottom-nav button {
        transform: none !important;
        transition: background 0.2s ease, color 0.2s ease !important;
    }
    .bottom-nav a:active, .bottom-nav button:active, 
    .bottom-nav a:focus, .bottom-nav button:focus {
        transform: none !important;
        outline: none !important;
        box-shadow: none !important;
    }
</style>
</head>
<body>
<div class="container">
    <div class="converter-card">
        <div class="history" id="historyContainer">
            <div class="clear-history" onclick="clearHistory()">✖ Очистить</div>
            <div id="historyList">—</div>
        </div>

        <div class="categories-grid" id="categoriesGrid"></div>
        <div class="back-link-wrapper">
            <button class="back-link" onclick="window.location.href='index.html'">← Назад в меню</button>
        </div>
    </div>
</div>

<div id="converterModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Конвертер</h3>
            <span class="close-modal" id="closeModalBtn">&times;</span>
        </div>
        <div class="converter-body" id="converterBody">
            <div class="input-group">
                <label>Введите значение</label>
                <input type="number" id="inputValue" class="converter-input" placeholder="0" step="any" value="1" inputmode="decimal">
            </div>
            <div class="unit-select-row">
                <select id="fromUnit" class="select-unit"></select>
                <div class="swap-icon" id="swapUnitsBtn">⇄</div>
                <select id="toUnit" class="select-unit"></select>
            </div>
            <div class="output-group">
                <label>Результат</label>
                <input type="text" id="outputValue" class="converter-output" readonly placeholder="—">
            </div>
            <div class="info-note" id="infoNote">Автоматический пересчет</div>
        </div>
    </div>
</div>

<script>
    const baseConverters = {
        length: {
            name: "Длина",
            units: ["Метры (м)", "Километры (км)", "Сантиметры (см)", "Миллиметры (мм)", "Мили", "Футы", "Дюймы"],
            toMeter: { "Метры (м)": 1, "Километры (км)": 1000, "Сантиметры (см)": 0.01, "Миллиметры (мм)": 0.001, "Мили": 1609.344, "Футы": 0.3048, "Дюймы": 0.0254 },
            convert: (v, f, t, d) => (v * d.toMeter[f]) / d.toMeter[t]
        },
        mass: {
            name: "Масса",
            units: ["Килограммы (кг)", "Граммы (г)", "Миллиграммы (мг)", "Тонны (т)", "Фунты", "Унции"],
            toKg: { "Килограммы (кг)": 1, "Граммы (г)": 0.001, "Миллиграммы (мг)": 0.000001, "Тонны (т)": 1000, "Фунты": 0.453592, "Унции": 0.0283495 },
            convert: (v, f, t, d) => (v * d.toKg[f]) / d.toKg[t]
        },
        time: {
            name: "Время",
            units: ["Секунды (с)", "Миллисекунды (мс)", "Минуты", "Часы", "Дни"],
            toSec: { "Секунды (с)": 1, "Миллисекунды (мс)": 0.001, "Минуты": 60, "Часы": 3600, "Дни": 86400 },
            convert: (v, f, t, d) => (v * d.toSec[f]) / d.toSec[t]
        },
        area: {
            name: "Площадь",
            units: ["м²", "км²", "см²", "мм²", "Гектары (га)", "Акры"],
            toSqM: { "м²": 1, "км²": 1e6, "см²": 0.0001, "мм²": 0.000001, "Гектары (га)": 10000, "Акры": 4046.86 },
            convert: (v, f, t, d) => (v * d.toSqM[f]) / d.toSqM[t]
        },
        volume: {
            name: "Объем",
            units: ["м³", "Литры (л)", "Миллилитры (мл)", "см³", "мм³"],
            toCubicM: { "м³": 1, "Литры (л)": 0.001, "Миллилитры (мл)": 0.000001, "см³": 0.000001, "мм³": 0.000000001 },
            convert: (v, f, t, d) => (v * d.toCubicM[f]) / d.toCubicM[t]
        },
        speed: {
            name: "Скорость",
            units: ["м/с", "км/ч", "миль/ч", "узлы"],
            toMps: { "м/с": 1, "км/ч": 1/3.6, "миль/ч": 0.44704, "узлы": 0.514444 },
            convert: (v, f, t, d) => (v * d.toMps[f]) / d.toMps[t]
        },
        temperature: {
            name: "Температура",
            units: ["Цельсий (°C)", "Фаренгейт (°F)", "Кельвин (К)"],
            convert: (v, f, t) => {
                let c;
                if (f === "Цельсий (°C)") c = v;
                else if (f === "Фаренгейт (°F)") c = (v - 32) * 5/9;
                else c = v - 273.15;
                if (t === "Цельсий (°C)") return c;
                if (t === "Фаренгейт (°F)") return c * 9/5 + 32;
                return c + 273.15;
            }
        },
        pressure: {
            name: "Давление",
            units: ["Паскали (Па)", "Килопаскали (кПа)", "Мегапаскали (МПа)", "Бары", "Атмосферы (атм)", "мм рт. ст."],
            toPa: { "Паскали (Па)": 1, "Килопаскали (кПа)": 1000, "Мегапаскали (МПа)": 1000000, "Бары": 100000, "Атмосферы (атм)": 101325, "мм рт. ст.": 133.322 },
            convert: (v, f, t, d) => (v * d.toPa[f]) / d.toPa[t]
        },
        energy: {
            name: "Энергия",
            units: ["Джоули (Дж)", "Килоджоули (кДж)", "Калории (кал)", "Килокалории (ккал)", "Электрон-вольты (эВ)", "кВт·ч"],
            toJ: { "Джоули (Дж)": 1, "Килоджоули (кДж)": 1000, "Калории (кал)": 4.184, "Килокалории (ккал)": 4184, "Электрон-вольты (эВ)": 1.602e-19, "кВт·ч": 3600000 },
            convert: (v, f, t, d) => (v * d.toJ[f]) / d.toJ[t]
        },
        power: {
            name: "Мощность",
            units: ["Ватты (Вт)", "Киловатты (кВт)", "Мегаватты (МВт)", "Лошадиные силы (л.с.)"],
            toW: { "Ватты (Вт)": 1, "Киловатты (кВт)": 1000, "Мегаватты (МВт)": 1000000, "Лошадиные силы (л.с.)": 735.5 },
            convert: (v, f, t, d) => (v * d.toW[f]) / d.toW[t]
        },
        force: {
            name: "Сила",
            units: ["Ньютоны (Н)", "Килоньютоны (кН)", "Дин", "Килограмм-сила (кгс)"],
            toN: { "Ньютоны (Н)": 1, "Килоньютоны (кН)": 1000, "Дин": 0.00001, "Килограмм-сила (кгс)": 9.80665 },
            convert: (v, f, t, d) => (v * d.toN[f]) / d.toN[t]
        },
        data: {
            name: "Данные",
            units: ["Байты", "Килобайты (КБ)", "Мегабайты (МБ)", "Гигабайты (ГБ)", "Терабайты (ТБ)"],
            toBytes: { "Байты": 1, "Килобайты (КБ)": 1024, "Мегабайты (МБ)": 1048576, "Гигабайты (ГБ)": 1073741824, "Терабайты (ТБ)": 1099511627776 },
            convert: (v, f, t, d) => (v * d.toBytes[f]) / d.toBytes[t]
        },
        numeralSystem: {
            name: "Система счисления",
            units: ["Десятичная", "Двоичная", "Восьмеричная", "Шестнадцатеричная"],
            convert: (v, f, t) => {
                try {
                    let num;
                    if (f === "Десятичная") num = parseFloat(v);
                    else if (f === "Двоичная") num = parseInt(v, 2);
                    else if (f === "Восьмеричная") num = parseInt(v, 8);
                    else num = parseInt(v, 16);
                    if (isNaN(num)) return "Ошибка";
                    if (t === "Десятичная") return num;
                    if (t === "Двоичная") return num.toString(2);
                    if (t === "Восьмеричная") return num.toString(8);
                    return num.toString(16).toUpperCase();
                } catch(e) { return "неверно"; }
            }
        }
    };

    const categoriesList = [
        { id: "length", label: "Длина", icon: "ℓ" },
        { id: "mass", label: "Масса", icon: "kg" },
        { id: "time", label: "Время", icon: "⏱" },
        { id: "area", label: "Площадь", icon: "m²" },
        { id: "volume", label: "Объем", icon: "ℓ" },
        { id: "speed", label: "Скорость", icon: "km/h" },
        { id: "temperature", label: "Температура", icon: "°C" },
        { id: "pressure", label: "Давление", icon: "Pa" },
        { id: "energy", label: "Энергия", icon: "J" },
        { id: "power", label: "Мощность", icon: "W" },
        { id: "force", label: "Сила", icon: "N" },
        { id: "data", label: "Данные", icon: "MB" },
        { id: "numeralSystem", label: "Счисления", icon: "01" }
    ];

    let currentCategory = null, currentConverter = null;
    let history = [];

    function loadHistory() {
        const saved = localStorage.getItem('converter_history');
        if (saved) { try { history = JSON.parse(saved); } catch(e) { history = []; } }
        updateHistoryDisplay();
    }

    function saveHistory() { localStorage.setItem('converter_history', JSON.stringify(history.slice(-20))); }

    function addToHistory(fromVal, fromUnit, toVal, toUnit) {
        if (!fromVal || !toVal || toVal === 'Ошибка' || toVal === 'неверно') return;
        const fromStr = `${fromVal} ${fromUnit}`.trim();
        const toStr = `${toVal} ${toUnit}`.trim();
        if (history.length > 0 && history[0].from === fromStr && history[0].to === toStr) return;
        history.unshift({ from: fromStr, to: toStr });
        if (history.length > 20) history.pop();
        saveHistory(); updateHistoryDisplay();
    }

    function updateHistoryDisplay() {
        const historyList = document.getElementById('historyList');
        if (!historyList) return;
        if (history.length === 0) { historyList.innerHTML = '—'; return; }
        let html = '';
        for (let i = 0; i < Math.min(history.length, 8); i++) {
            html += `<div class="history-item" onclick="restoreFromHistory(${i})">${history[i].from} = ${history[i].to}</div>`;
        }
        historyList.innerHTML = html;
    }

    function restoreFromHistory(index) {
        if (history[index]) {
            const match = history[index].from.match(/([\d.,\-]+)\s+(.+)$/);
            if (match) {
                document.getElementById('inputValue').value = match[1];
                const fromSelect = document.getElementById('fromUnit');
                for (let i = 0; i < fromSelect.options.length; i++) {
                    if (fromSelect.options[i].text === match[2]) { fromSelect.selectedIndex = i; break; }
                }
                updateConversion();
            }
        }
    }

    function clearHistory() { history = []; saveHistory(); updateHistoryDisplay(); }

    function roundNumber(num) {
        if (typeof num !== 'number') return num;
        return parseFloat(num.toFixed(6)).toString();
    }

    const grid = document.getElementById('categoriesGrid');
    const modal = document.getElementById('converterModal');
    const modalTitle = document.getElementById('modalTitle');
    const fromSelect = document.getElementById('fromUnit');
    const toSelect = document.getElementById('toUnit');
    const inputElem = document.getElementById('inputValue');
    const outputElem = document.getElementById('outputValue');
    const closeBtn = document.getElementById('closeModalBtn');
    const swapBtn = document.getElementById('swapUnitsBtn');
    const infoNote = document.getElementById('infoNote');

    categoriesList.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'cat-card';
        card.innerHTML = `<div class="cat-icon">${cat.icon}</div><div class="cat-title">${cat.label}</div>`;
        card.onclick = () => openConverter(cat.id);
        grid.appendChild(card);
    });

    function openConverter(categoryId) {
        currentCategory = categoryId;
        currentConverter = baseConverters[categoryId];
        if (!currentConverter) return;
        modalTitle.textContent = currentConverter.name;

        let units = [...currentConverter.units];
        fromSelect.innerHTML = ''; toSelect.innerHTML = '';
        units.forEach(u => { fromSelect.add(new Option(u, u)); toSelect.add(new Option(u, u)); });

        if (categoryId === 'temperature') { fromSelect.value = "Цельсий (°C)"; toSelect.value = "Фаренгейт (°F)"; infoNote.innerText = "°C → °F: ×9/5+32"; }
        else if (categoryId === 'volume') { fromSelect.value = "Литры (л)"; toSelect.value = "м³"; infoNote.innerText = "1 л = 0.001 м³"; }
        else if (categoryId === 'numeralSystem') { fromSelect.value = "Десятичная"; toSelect.value = "Двоичная"; infoNote.innerText = "Перевод систем счисления"; }
        else { if (units[0]) fromSelect.value = units[0]; if (units[1]) toSelect.value = units[1]; infoNote.innerText = "Автоматический пересчет"; }

        inputElem.value = "1";
        updateConversion();
        modal.classList.add('active');
        localStorage.setItem('lastConverterCategory', categoryId);
    }

    function updateConversion() {
        if (!currentConverter) return;
        let val = parseFloat(inputElem.value);
        if (isNaN(val)) { outputElem.value = "ошибка"; return; }
        let from = fromSelect.value, to = toSelect.value;
        let res = currentConverter.convert(val, from, to, currentConverter);

        if (typeof res === 'number') {
            res = roundNumber(res);
            outputElem.value = res;
            addToHistory(val, from, res, to);
        } else {
            outputElem.value = res;
        }
    }

    function swapUnits() {
        let f = fromSelect.value, t = toSelect.value;
        fromSelect.value = t; toSelect.value = f;
        updateConversion();
    }

    inputElem.addEventListener('input', updateConversion);
    fromSelect.addEventListener('change', updateConversion);
    toSelect.addEventListener('change', updateConversion);
    swapBtn.addEventListener('click', swapUnits);
    closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    if (localStorage.getItem('mathTheme') === 'light') {
        document.documentElement.classList.add('light-mode');
        const __btn = document.getElementById('themeBtn'); if (__btn) __btn.textContent = '☀️';
    }

    loadHistory();

    const lastCategory = localStorage.getItem('lastConverterCategory');
    if (lastCategory) { setTimeout(() => openConverter(lastCategory), 100); }
</script>

<script src="favorites.js"></script>
<script src="theme.js"></script>
</body>
</html>
